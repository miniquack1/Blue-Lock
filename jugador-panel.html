<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Lock - Terminal del Jugador</title>
    <style>
        /* CONFIGURACIÓN BASE DIGITAL */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { 
            background-color: #040711; 
            color: #ffffff; 
            padding: 40px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 50%, #0d1527 0%, #040711 100%);
        }

        /* CONTENEDOR PRINCIPAL HOLOGRÁFICO MEJORADO */
        .container-panel {
            max-width: 700px; width: 100%; 
            background: rgba(13, 20, 39, 0.6);
            backdrop-filter: blur(10px);
            padding: 40px; border-radius: 20px;
            border: 1px solid rgba(0, 210, 255, 0.4); 
            box-shadow: 0 0 40px rgba(0, 210, 255, 0.15), inset 0 0 20px rgba(0, 210, 255, 0.05); 
            position: relative;
        }

        /* DISEÑO DE LA CABECERA DEL JUGADOR */
        .header-perfil { display: flex; align-items: center; gap: 25px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 25px; margin-bottom: 30px; }
        
        .avatar-container {
            position: relative;
            width: 90px; height: 90px;
            display: flex; justify-content: center; align-items: center;
        }
        .avatar-box { 
            font-size: 3rem; background: #060a13; 
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            border-radius: 50%; border: 2px solid #00d2ff;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
            z-index: 2;
        }
        /* Círculo giratorio decorativo de fondo */
        .avatar-ring {
            position: absolute; width: 106px; height: 106px;
            border: 2px dashed rgba(0, 210, 255, 0.5);
            border-radius: 50%; animation: rotar 20s linear infinite;
        }
        @keyframes rotar { 100% { transform: rotate(360deg); } }

        .info-titulo h1 { 
            font-size: 1.6rem; color: #ffffff; text-transform: uppercase; letter-spacing: 2px; font-weight: 800;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
        .status-online { 
            display: inline-block; background: rgba(0, 255, 136, 0.1); border: 1px solid #00ff88; 
            color: #00ff88; font-size: 0.7rem; padding: 4px 12px; border-radius: 20px; font-weight: bold; 
            margin-top: 8px; letter-spacing: 1px; text-shadow: 0 0 5px rgba(0, 255, 136, 0.5);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.1);
        }

        /* REJILLA DE TARJETAS MODERNA */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 35px; }
        .stat-card { 
            background: rgba(6, 10, 19, 0.7); padding: 18px; border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.05); text-align: center;
            transition: transform 0.3s, border-color 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            border-color: rgba(0, 210, 255, 0.4);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        .stat-card p { font-size: 0.75rem; color: #64748b; text-transform: uppercase; font-weight: bold; margin-bottom: 8px; letter-spacing: 1px; }
        .stat-card h2 { font-size: 1.3rem; font-weight: 700; }

        /* BARRAS DE PROGRESO CON ANIMACIÓN */
        .skills-section h3 { text-align: left; font-size: 1rem; color: #00d2ff; text-transform: uppercase; margin-bottom: 20px; letter-spacing: 1.5px; text-shadow: 0 0 8px rgba(0, 210, 255, 0.3); }
        .skill-group { margin-bottom: 20px; }
        .skill-info { display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; color: #e2e8f0; letter-spacing: 0.5px; }
        
        .progress-bar-bg { width: 100%; height: 10px; background: #090d16; border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        .progress-bar-fill { 
            height: 100%; background: linear-gradient(90deg, #0052cc, #00d2ff); border-radius: 20px; 
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.6); 
            width: 0%; transition: width 1.2s cubic-bezier(0.1, 0.8, 0.2, 1); /* Efecto de carga fluida al entrar */
        }

        /* BOTÓN DE DESCONEXIÓN ULTRA MODERNO */
        .btn-regresar {
            display: inline-block; width: 100%; margin-top: 25px; padding: 15px; background: rgba(255, 42, 95, 0.05);
            border: 1px solid #ff2a5f; color: #ff2a5f; text-decoration: none; font-weight: bold;
            border-radius: 8px; text-transform: uppercase; letter-spacing: 2px; font-size: 0.9rem;
            transition: all 0.3s ease; text-align: center; box-shadow: 0 0 15px rgba(255, 42, 95, 0.05);
        }
        .btn-regresar:hover { 
            background: #ff2a5f; color: #ffffff; 
            box-shadow: 0 0 25px rgba(255, 42, 95, 0.5), 0 0 10px rgba(255, 42, 95, 0.3);
            transform: scale(1.01);
        }
    </style>
</head>
<body>

    <div class="container-panel">
        
        <!-- CABECERA DE PERFIL CON ANILLO DE ESCANEO -->
        <div class="header-perfil">
            <div class="avatar-container">
                <div class="avatar-ring"></div>
                <div class="avatar-box">⚽</div>
            </div>
            <div class="info-titulo">
                <h1 id="txt-titulo">Cargando Atleta...</h1>
                <div class="status-online">SINCRO-TRAJE: ONLINE</div>
            </div>
        </div>

        <!-- REJILLA DE DATOS TÁCTICOS -->
        <div class="stats-grid">
            <div class="stat-card">
                <p>Ubicación Actual</p>
                <h2 style="color: #00d2ff; text-shadow: 0 0 10px rgba(0, 210, 255, 0.3);">BLOQUE Z</h2>
            </div>
            <div class="stat-card">
                <p>Valor de Mercado NEL</p>
                <h2 id="txt-sueldo" style="color: #00ff88; text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);">¥ 0</h2>
            </div>
            <div class="stat-card">
                <p>Menú Nutricional</p>
                <h2 id="txt-comida" style="color: #ffbc00; font-size: 1.1rem; text-shadow: 0 0 10px rgba(255, 188, 0, 0.2);">Cargando...</h2>
            </div>
        </div>

        <!-- SECCIÓN DE ARMAS Y NIVELES -->
        <div class="skills-section">
            <h3>EVALUACIÓN DEL ARMAMENTO CUÁNTICO</h3>
            <div id="contenedor-habilidades">
                <!-- El script inyectará las barras animadas aquí de forma automática -->
            </div>
        </div>

        <!-- BOTÓN CON DISEÑO MEJORADO -->
        <a href="registro.html" class="btn-regresar">Desconectar Terminal de Datos</a>

    </div>
    <script>
        window.onload = function() {
            // Leer el ID que inició sesión (por defecto Isagi BL-299)
            const idJugador = localStorage.getItem('jugadorActual') || "BL-299";
            
            // Base de datos de habilidades y alimentos
            const datosJugadores = {
                "BL-299": { nombre: "Yoichi Isagi", sueldo: "¥ 150,000,000", comida: "🥩 Filete clase A", s1: "Metavisión", n1: "94%", s2: "Tiro Directo", n2: "88%", s3: "Velocidad", n3: "79%", s4: "Egoísmo", n4: "99%", colorEgo: "#ff2a5f" },
                "BL-290": { nombre: "Meguru Bachira", sueldo: "¥ 79,000,000", comida: "🍮 Natillas dulces", s1: "Regate Monstruoso", n1: "97%", s2: "Pase Creativo", n2: "91%", s3: "Estado de Trance", n3: "95%", s4: "Egoísmo", n4: "93%", colorEgo: "#ffbc00" },
                "BL-221": { nombre: "Seishiro Nagi", sueldo: "¥ 88,000,000", comida: "🍋 Té con Limón", s1: "Control de Balón", n1: "99%", s2: "Tiro de Volea", n2: "93%", s3: "Creatividad", n3: "96%", s4: "Egoísmo", n4: "70%", colorEgo: "#00d2ff" },
                "BL-001": { nombre: "Rin Itoshi", sueldo: "¥ 180,000,000", comida: "🍲 Chankonabe Premium", s1: "Tiro de Precisión", n1: "98%", s2: "Control de Marionetas", n2: "96%", s3: "Físico Táctico", n3: "92%", s4: "Egoísmo", n4: "98%", colorEgo: "#ff2a5f" }
            };

            const jugador = datosJugadores[idJugador];

            // Inyectar textos estructurados
            document.getElementById('txt-titulo').innerHTML = `FICHA: ${jugador.nombre} (${idJugador})`;
            document.getElementById('txt-sueldo').innerHTML = jugador.sueldo;
            document.getElementById('txt-comida').innerHTML = jugador.comida;

            // Renderizar la estructura base de las barras
            document.getElementById('contenedor-habilidades').innerHTML = `
                <div class="skill-group">
                    <div class="skill-info"><span>${jugador.s1}</span><span>${jugador.n1}</span></div>
                    <div class="progress-bar-bg"><div class="progress-bar-fill" id="bar1"></div></div>
                </div>
                <div class="skill-group">
                    <div class="skill-info"><span>${jugador.s2}</span><span>${jugador.n2}</span></div>
                    <div class="progress-bar-bg"><div class="progress-bar-fill" id="bar2"></div></div>
                </div>
                <div class="skill-group">
                    <div class="skill-info"><span>${jugador.s3}</span><span>${jugador.n3}</span></div>
                    <div class="progress-bar-bg"><div class="progress-bar-fill" id="bar3"></div></div>
                </div>
                <div class="skill-group">
                    <div class="skill-info"><span>${jugador.s4}</span><span>${jugador.n4}</span></div>
                    <div class="progress-bar-bg"><div class="progress-bar-fill" id="bar4" style="background: linear-gradient(90deg, ${jugador.colorEgo}, #ffbc00); box-shadow: 0 0 12px ${jugador.colorEgo};"></div></div>
                </div>
            `;

            // Pequeño delay para disparar la animación de llenado automático (Efecto carga de juego)
            setTimeout(() => {
                document.getElementById('bar1').style.width = jugador.n1;
                document.getElementById('bar2').style.width = jugador.n2;
                document.getElementById('bar3').style.width = jugador.n3;
                document.getElementById('bar4').style.width = jugador.n4;
            }, 150);
        };
    </script>
</body>
</html>
